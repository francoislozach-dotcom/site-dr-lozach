<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">FIBULAIRE SUPERFICIEL / SORTIE DU FASCIA</text><text x="52" y="111" font-size="37" class="">De la profondeur vers les tissus sous la peau</text><rect x="52" y="179" width="1096" height="355" rx="16" fill="#102034"/><path d="M80 269H1120" stroke="#8b9fb5" stroke-width="3"/><path d="M80 405H561M665 405H1120" stroke="#b2c4d8" stroke-width="11"/><path d="M80 467Q290 440 445 470T800 468T1120 469" fill="none" stroke="#37566b" stroke-width="42"/><path class="nerve" d="M91 443Q402 451 547 431Q610 426 634 390Q670 337 834 332H1100"/><circle cx="623" cy="405" r="19" class="spot"/><text x="91" y="226" font-size="24" class="">Peau</text><text x="90" y="326" font-size="24" class="">Tissus sous-cutanés</text><text x="92" y="384" font-size="24" class="">Fascia : enveloppe fibreuse</text><text x="92" y="514" font-size="22" class="muted">Muscle (profondeur)</text><text x="760" y="310" font-size="23" class="cyan">Nerf devenu superficiel</text><path class="lead" d="M643 417L812 572"/><text x="830" y="588" font-size="25" class="">Zone de passage</text><text x="52" y="633" font-size="21" class="muted">Coupe longitudinale schématique : la profondeur est exagérée pour la lisibilité.</text><text x="52" y="673" font-size="21" class="cyan">L’orifice fascial peut être un point de conflit ; sa position et ses branches varient.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">01 / SAPHÈNE</text><text x="52" y="111" font-size="37" class="">La face interne du genou et de la jambe</text><path class="bone" d="M164 164L158 332Q123 354 148 389Q169 416 187 393Q209 421 231 392Q253 360 220 336L214 164Z"/><path class="bone" d="M149 420Q183 405 227 420L210 598H173Z"/><path class="nerve" d="M265 164Q254 244 263 288Q278 344 266 392L254 595M267 391Q219 404 189 398"/><circle cx="262" cy="285" r="19" class="spot"/><circle cx="241" cy="398" r="19" class="spot"/><path class="lead" d="M283 285H433M263 398H433M254 559H433"/><text x="457" y="250" font-size="26" class="">Canal des adducteurs (Hunter)</text><text x="457" y="287" font-size="23" class="muted">Passage sous le sartorius,</text><text x="457" y="319" font-size="23" class="muted">dans la partie interne de la cuisse.</text><text x="457" y="393" font-size="26" class="">Branche infrapatellaire</text><text x="457" y="430" font-size="23" class="muted">Vers la peau de l’avant du genou.</text><text x="457" y="462" font-size="23" class="muted">Une cicatrice peut irriter cette branche.</text><text x="457" y="550" font-size="26" class="">Branche sensitive de la jambe</text><text x="457" y="587" font-size="23" class="muted">Pas de paralysie musculaire</text><text x="457" y="619" font-size="23" class="muted">dans une atteinte isolée du saphène.</text><text x="52" y="660" font-size="20" class="muted">Vue interne simplifiée · trajets et proportions indicatifs, variables selon les personnes.</text><text x="52" y="695" font-size="20" class="cyan">Trait doré : nerf   ·   Cercle cyan : région à examiner, pas un diagnostic</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">03 / TIBIAL</text><text x="52" y="111" font-size="37" class="">Derrière la malléole interne, vers la plante</text><path class="bone" d="M151 158L151 377Q106 427 138 475Q159 501 210 492L384 492Q425 492 425 470Q425 453 393 449L296 426Q249 412 227 377L225 158Z"/><circle cx="207" cy="363" r="22" class="bone"/><path class="nerve" d="M118 163L118 357Q115 407 152 440Q180 459 222 457L373 468M193 453Q236 429 293 444"/><circle cx="133" cy="411" r="19" class="spot"/><path class="lead" d="M230 363L441 279M155 411H441M303 467L441 517"/><text x="471" y="270" font-size="26" class="">Malléole médiale (interne)</text><text x="471" y="307" font-size="23" class="muted">Le nerf passe en arrière de ce repère.</text><text x="471" y="408" font-size="26" class="">Tunnel tarsien postérieur</text><text x="471" y="445" font-size="23" class="muted">Sous le rétinaculum des fléchisseurs.</text><text x="471" y="524" font-size="26" class="">Branches plantaires</text><text x="471" y="561" font-size="23" class="muted">Elles se dirigent vers la plante du pied.</text><text x="471" y="593" font-size="23" class="muted">Des conflits plus distaux sont possibles.</text><text x="52" y="650" font-size="20" class="muted">Vue interne simplifiée · branches décalées pour la lisibilité, non à l’échelle.</text><text x="52" y="681" font-size="20" class="muted">Les branches du talon varient ; elles ne sont pas représentées ici.</text><text x="52" y="711" font-size="18" class="cyan">À distinguer du tunnel tarsien antérieur : nerf fibulaire profond, à l’avant de la cheville.</text></svg>
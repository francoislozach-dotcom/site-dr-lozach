<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">02 / FIBULAIRE COMMUN — ANCIENNEMENT SPE</text><text x="52" y="111" font-size="37" class="">Un passage exposé à l’extérieur du genou</text><path class="bone" d="M167 162L163 288Q127 309 151 342Q179 364 201 340Q225 366 250 340Q273 310 239 289L231 162Z"/><path class="bone" d="M155 375Q201 354 250 375L224 600H179Z"/><path class="bone" d="M295 395Q267 374 280 355Q299 340 317 358Q325 373 307 394L301 600H286Z"/><path class="nerve" d="M346 166Q350 278 325 325Q294 348 307 390Q335 416 349 441L358 598M331 418Q281 462 260 598"/><circle cx="308" cy="390" r="19" class="spot"/><path class="lead" d="M329 390H453M300 356L427 305M357 544H455M264 580L427 604"/><text x="478" y="294" font-size="26" class="">Tête de la fibula</text><text x="478" y="331" font-size="23" class="muted">Repère osseux sur le côté externe.</text><text x="478" y="404" font-size="26" class="">Col de la fibula</text><text x="478" y="441" font-size="23" class="muted">Le nerf le contourne, puis passe</text><text x="478" y="473" font-size="23" class="muted">sous le muscle long fibulaire.</text><text x="478" y="550" font-size="26" class="">Branche superficielle</text><text x="478" y="610" font-size="26" class="">Branche profonde</text><text x="52" y="660" font-size="20" class="muted">Vue externe simplifiée · bifurcation et trajets schématiques, non à l’échelle.</text><text x="52" y="695" font-size="20" class="cyan">Une faiblesse nouvelle pour relever le pied nécessite un avis médical rapide.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">CHEVILLE / DEUX LOCALISATIONS DIFFÉRENTES</text><text x="52" y="111" font-size="37" class="">Tunnel antérieur ≠ tunnel postérieur</text><rect x="52" y="163" width="514" height="416" rx="18" fill="#102034"/><rect x="634" y="163" width="514" height="416" rx="18" fill="#102034"/><text x="80" y="208" font-size="26" class="">À l’avant de la cheville</text><text x="661" y="208" font-size="25" class="">Derrière la malléole interne</text><path class="bone" d="M160 244L164 345L125 474Q126 506 158 508L294 504Q330 496 304 464L268 345L266 244"/><path class="nerve" d="M219 249L219 354Q216 399 250 439L263 482"/><path d="M158 347Q215 367 274 347" fill="none" stroke="#8b9fb5" stroke-width="14"/><circle cx="219" cy="354" r="19" class="spot"/><text x="82" y="551" font-size="22" class="cyan">Fibulaire profond · dos du pied</text><path class="bone" d="M718 248L718 420Q687 451 724 474L966 474Q984 453 946 443L824 415L793 374L793 248"/><circle cx="784" cy="386" r="17" class="bone"/><path class="nerve" d="M696 250L699 407Q707 451 754 450L943 458"/><circle cx="709" cy="422" r="19" class="spot"/><text x="663" y="551" font-size="22" class="cyan">Tibial · vers la plante du pied</text><text x="81" y="612" font-size="21" class="muted">Vue de face, pied droit</text><text x="663" y="612" font-size="21" class="muted">Vue interne</text><text x="52" y="660" font-size="21" class="muted">Dessins simplifiés, non à l’échelle : les deux tunnels concernent des nerfs différents.</text><text x="52" y="696" font-size="21" class="cyan">La localisation de la douleur oriente l’examen ; elle ne suffit pas au diagnostic.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="65" font-size="20" class="cyan">LES NERFS DU MEMBRE INFÉRIEUR</text><text x="52" y="120" font-size="37" class="">Comprendre les branches, localiser le conflit</text><g fill="none" stroke="#f5cc79" stroke-width="3"><path d="M227 277V335"/><path d="M825 277V307H662V335M825 307H1000V335"/><path d="M662 422V455H520V495M662 455H765V495"/><path d="M1000 422V495"/></g><rect x="52" y="190" width="350" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="72" y="225" font-size="25" class="">Nerf fémoral</text><text x="72" y="255" font-size="19" class="muted">À l’avant de la cuisse</text><rect x="640" y="190" width="370" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="660" y="225" font-size="25" class="">Nerf sciatique</text><text x="660" y="255" font-size="19" class="muted">À l’arrière de la cuisse</text><rect x="52" y="335" width="350" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="72" y="370" font-size="25" class="">Saphène</text><text x="72" y="400" font-size="19" class="muted">Branche sensitive · côté interne</text><rect x="482" y="335" width="360" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="502" y="370" font-size="25" class="">Fibulaire commun = SPE</text><text x="502" y="400" font-size="19" class="muted">Près du col de la fibula</text><rect x="870" y="335" width="278" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="890" y="370" font-size="25" class="">Tibial</text><text x="890" y="400" font-size="19" class="muted">Mollet · cheville interne</text><rect x="415" y="495" width="235" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="435" y="530" font-size="25" class="">Superficiel</text><text x="435" y="560" font-size="19" class="muted">Dos du pied</text><rect x="675" y="495" width="195" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="695" y="530" font-size="25" class="">Profond</text><text x="695" y="560" font-size="19" class="muted">Entre orteils 1–2</text><rect x="895" y="495" width="253" height="87" rx="12" fill="#11243a" stroke="#38506a"/><text x="915" y="530" font-size="25" class="">Plantaires</text><text x="915" y="560" font-size="19" class="muted">Plante du pied</text><text x="52" y="646" font-size="21" class="muted">Arbre simplifié : seuls certains nerfs et certaines branches sont représentés.</text><text x="52" y="680" font-size="21" class="cyan">SPE est l’ancien nom du fibulaire commun : ce ne sont pas deux nerfs différents.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" rx="24" fill="#08111f"/><style>text{font-family:Arial,sans-serif;fill:#e9f1fb}.muted{fill:#a9bed2}.cyan{fill:#39d4eb}.bone{fill:#15263a;stroke:#8296ac;stroke-width:3}.nerve{fill:none;stroke:#f5cc79;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.lead{fill:none;stroke:#748ba2;stroke-width:2}.spot{fill:#102b39;stroke:#39d4eb;stroke-width:3}</style><text x="52" y="59" font-size="19" class="cyan">LE MÉCANISME / UNE CONTRAINTE QUI CHANGE</text><text x="52" y="111" font-size="37" class="">Au repos et pendant le mouvement</text><rect x="52" y="162" width="513" height="415" rx="18" fill="#102034" stroke="#38506a"/><text x="76" y="211" font-size="22" class="">Au repos</text><path d="M77 286H541M77 449H541" stroke="#8b9fb5" stroke-width="14"/><path class="nerve" d="M77 369Q312 350 541 369"/><text x="77" y="515" font-size="23" class="muted">Le passage peut laisser le nerf</text><text x="77" y="547" font-size="23" class="muted">glisser avec peu de contrainte.</text><rect x="635" y="162" width="513" height="415" rx="18" fill="#102034" stroke="#38506a"/><text x="659" y="211" font-size="22" class="">À l’effort ou en position déclenchante</text><path d="M660 286Q885 402 1124 286M660 449Q885 337 1124 449" fill="none" stroke="#8b9fb5" stroke-width="14"/><path class="nerve" d="M660 369Q885 367 1124 369"/><text x="660" y="515" font-size="23" class="muted">La contraction ou la posture peut</text><text x="660" y="547" font-size="23" class="muted">augmenter pression ou traction.</text><text x="52" y="629" font-size="22" class="muted">Schéma de principe, sans échelle : les mécanismes varient selon le site.</text><text x="52" y="670" font-size="22" class="cyan">Une gêne à l’effort ne démontre pas, à elle seule, une compression nerveuse.</text></svg>
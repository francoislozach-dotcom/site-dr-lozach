@keyframes gr-irm-fade {

.gr-irm-hud-tl { position: absolute; top: 18px; right: 18px; padding: 6px 10px; background: rgba(3,6,15,0.7); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--gr-border); border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.16em; color: var(--gr-accent-3); z-index: 4; }
